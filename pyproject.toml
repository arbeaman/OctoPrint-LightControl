[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-LightControl"
version = "2.0.1"
description = "Control 3D printer lights."
authors = [
    {name = "Alerick Beaman", email = "35195829+arbeaman@users.noreply.github.com"}
]
readme = {file = "README.md", content-type = "text/markdown"}
dynamic = ["license"]
requires-python = ">=3.7, <4"

# any additional requirements besides OctoPrint should be listed here
dependencies = [
    "python-periphery"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_lightcontrol",
    "octoprint_lightcontrol.*"
]

[project.entry-points."octoprint.plugin"]
lightcontrol = "octoprint_lightcontrol"

[project.urls]
Homepage = "https://github.com/arbeaman/OctoPrint-LightControl"
